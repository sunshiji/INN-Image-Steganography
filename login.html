<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>登录 — INN 图像隐写系统</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet" />
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet" />
  <style>
    body {
      font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
      min-height: 100vh;
      background: linear-gradient(135deg, #e0e7ff 0%, #f0f9ff 50%, #ede9fe 100%);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    input:focus { outline: none; }
    .shake { animation: shake 0.35s ease; }
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%       { transform: translateX(-8px); }
      40%       { transform: translateX(8px); }
      60%       { transform: translateX(-5px); }
      80%       { transform: translateX(5px); }
    }
  </style>
</head>
<body>

  <!-- Login card -->
  <div class="w-full max-w-md bg-white rounded-2xl shadow-2xl p-10 border border-indigo-50 mx-4">

    <!-- Logo / Brand -->
    <div class="flex items-center justify-center gap-3 mb-8">
      <div class="w-12 h-12 rounded-xl bg-indigo-600 flex items-center justify-center shadow-lg shadow-indigo-200">
        <i class="fa-solid fa-eye-slash text-white text-xl"></i>
      </div>
      <div>
        <p class="text-xl font-bold text-indigo-700 leading-tight">INN 图像隐写系统</p>
        <p class="text-xs text-slate-400 leading-tight">Invertible Neural Network Steganography</p>
      </div>
    </div>

    <h2 class="text-2xl font-bold text-slate-800 text-center mb-1">用户登录</h2>
    <p class="text-sm text-slate-400 text-center mb-7">请输入账号和密码以继续访问</p>

    <!-- Error message -->
    <div id="error-msg" class="hidden mb-5 px-4 py-3 bg-red-50 border border-red-200 rounded-xl">
      <div class="flex items-center gap-2 text-red-600 text-sm font-medium">
        <i class="fa-solid fa-circle-exclamation"></i>
        <span id="error-text">用户名或密码错误</span>
      </div>
    </div>

    <!-- Login form -->
    <form id="login-form" onsubmit="doLogin(event)" novalidate>

      <!-- Username -->
      <div class="mb-5">
        <label class="block text-sm font-semibold text-slate-700 mb-1.5" for="username">用户名</label>
        <div class="relative">
          <i class="fa-solid fa-user absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 text-sm pointer-events-none"></i>
          <input id="username" type="text" autocomplete="username" required
            class="w-full pl-10 pr-4 py-2.5 border border-slate-200 rounded-xl text-sm text-slate-800 focus:ring-2 focus:ring-indigo-400 focus:border-transparent transition bg-slate-50"
            placeholder="请输入用户名" />
        </div>
      </div>

      <!-- Password -->
      <div class="mb-7">
        <label class="block text-sm font-semibold text-slate-700 mb-1.5" for="password">密码</label>
        <div class="relative">
          <i class="fa-solid fa-lock absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 text-sm pointer-events-none"></i>
          <input id="password" type="password" autocomplete="current-password" required
            class="w-full pl-10 pr-10 py-2.5 border border-slate-200 rounded-xl text-sm text-slate-800 focus:ring-2 focus:ring-indigo-400 focus:border-transparent transition bg-slate-50"
            placeholder="请输入密码" />
          <button type="button" onclick="togglePwd()"
            class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600 transition-colors">
            <i class="fa-solid fa-eye text-sm" id="pwd-eye"></i>
          </button>
        </div>
      </div>

      <!-- Submit -->
      <button type="submit" id="login-btn"
        class="w-full py-2.5 bg-indigo-600 text-white rounded-xl font-semibold text-sm hover:bg-indigo-700 active:bg-indigo-800 transition-colors flex items-center justify-center gap-2 shadow-md shadow-indigo-200">
        <i class="fa-solid fa-right-to-bracket"></i>
        登 录
      </button>
    </form>

    <!-- Links: Forgot password & Register -->
    <div class="flex items-center justify-between mt-5 text-sm">
      <a href="/forgot-password"
        class="text-indigo-500 hover:text-indigo-700 font-medium transition-colors">
        <i class="fa-solid fa-key mr-1"></i>忘记密码？
      </a>
      <a href="/register"
        class="text-indigo-500 hover:text-indigo-700 font-medium transition-colors">
        <i class="fa-solid fa-user-plus mr-1"></i>注册新用户
      </a>
    </div>

    <!-- Footer hint -->
    <p class="text-center text-xs text-slate-400 mt-6">
      <i class="fa-solid fa-shield-halved mr-1 text-indigo-300"></i>
      访问受保护 &nbsp;·&nbsp; 需要身份验证方可进入
    </p>
  </div>

  <script>
    async function doLogin(e) {
      e.preventDefault();
      hideError();

      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;

      if (!username || !password) {
        showError('请输入用户名和密码');
        return;
      }

      const btn = document.getElementById('login-btn');
      btn.disabled = true;
      btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> 登录中…';

      try {
        const resp = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password }),
          credentials: 'same-origin',
        });
        const data = await resp.json();
        if (resp.ok) {
          window.location.href = '/';
        } else {
          showError(data.error || '用户名或密码错误');
          document.getElementById('login-form').classList.add('shake');
          setTimeout(() => document.getElementById('login-form').classList.remove('shake'), 400);
        }
      } catch (err) {
        showError('网络错误，请稍后重试');
      } finally {
        btn.disabled = false;
        btn.innerHTML = '<i class="fa-solid fa-right-to-bracket"></i> 登 录';
      }
    }

    function showError(msg) {
      document.getElementById('error-text').textContent = msg;
      document.getElementById('error-msg').classList.remove('hidden');
    }

    function hideError() {
      document.getElementById('error-msg').classList.add('hidden');
    }

    function togglePwd() {
      const inp = document.getElementById('password');
      const eye = document.getElementById('pwd-eye');
      if (inp.type === 'password') {
        inp.type = 'text';
        eye.className = 'fa-solid fa-eye-slash text-sm';
      } else {
        inp.type = 'password';
        eye.className = 'fa-solid fa-eye text-sm';
      }
    }
  </script>

</body>
</html>
