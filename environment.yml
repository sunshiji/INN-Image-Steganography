# ---------------------------------------------------------------------------
# environment.yml - inn-stego conda environment
#
# Creates a complete Python 3.10 environment for INN-Image-Steganography,
# including GPU-only PyTorch (CUDA 12.1 build).
#
# Requirements:
#   An NVIDIA GPU with driver >= 525.  nvcc / full CUDA toolkit is NOT
#   required — the driver alone (detectable via nvidia-smi) is sufficient.
#
# Usage:
#   conda env create -f environment.yml   # one-time: creates env + installs everything
#   conda activate inn-stego
#   bash start.sh                         # start the service
#
# Update an existing env after code changes:
#   conda env update -f environment.yml --prune
# ---------------------------------------------------------------------------

name: inn-stego

channels:
  - https://mirrors.tuna.tsinghua.edu.cn/anaconda/cloud/conda-forge
  - https://mirrors.tuna.tsinghua.edu.cn/anaconda/pkgs/main
  - defaults

dependencies:
  - python=3.10
  # Scientific stack — compatible versions known to work with PyTorch 2.x
  - numpy=1.26
  - scipy=1.13
  - pillow=10.4
  - pip

  # All pip packages, including GPU-only PyTorch (CUDA 12.1).
  # The --extra-index-url line tells pip where to find the +cu121 wheels.
  - pip:
    - --extra-index-url https://download.pytorch.org/whl/cu121
    - torch==2.1.0+cu121
    - torchvision==0.16.0+cu121
    - flask>=3.0
    - flask-cors>=4.0
    - gunicorn>=20.0
