# ---------------------------------------------------------------------------
# environment.yml - inn-stego conda environment
#
# Creates a complete Python 3.10 environment for INN-Image-Steganography.
# ALL packages — including GPU PyTorch — are installed via conda so that
# "conda env create" never invokes pip and never hangs on network downloads.
#
# Requirements:
#   An NVIDIA GPU with driver >= 525.  nvcc / full CUDA toolkit is NOT
#   required — the driver alone (detectable via nvidia-smi) is sufficient.
#
# Usage:
#   conda env create -f environment.yml   # one-time: creates env + installs everything
#   conda activate inn-stego
#   bash start.sh                         # start the service
#
# Update an existing env after code changes:
#   conda env update -f environment.yml --prune
# ---------------------------------------------------------------------------

name: inn-stego

channels:
  # pytorch channel must come first so conda resolves GPU pytorch builds
  - https://mirrors.tuna.tsinghua.edu.cn/anaconda/cloud/pytorch
  - https://mirrors.tuna.tsinghua.edu.cn/anaconda/cloud/conda-forge
  - https://mirrors.tuna.tsinghua.edu.cn/anaconda/pkgs/main
  - defaults

dependencies:
  - python=3.10
  # Scientific stack
  - numpy=1.26
  - scipy=1.13
  - pillow=10.4
  # GPU PyTorch — pytorch-cuda pins the CUDA runtime bundled with the wheel;
  # driver 525+ supports CUDA 12.1 runtime even without nvcc installed.
  - pytorch=2.1.0
  - torchvision=0.16.0
  - pytorch-cuda=12.1
  # Web framework
  - flask>=3.0
  - flask-cors>=4.0
  - gunicorn>=20.0
